[program:app]
command=/srv/venv/bin/gunicorn -u app -g app -b 0.0.0.0:8080 -w 4 --preload --error-logfile /srv/logs/error.log --access-logfile /srv/logs/access.log app
directory=/srv/app
autostart=true
autorestart=true
stdout_logfile=/srv/logs/python.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=5
redirect_stderr=true
