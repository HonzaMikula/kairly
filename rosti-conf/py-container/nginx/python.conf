server {
        listen       0.0.0.0:8000;
        listen       [::]:8000;

        # if ($http_host = www.kairly.com) {
        #         rewrite  (.*)  https://kairly.com$1;
        # }

        location /api/ {
                proxy_pass         http://127.0.0.1:8080/;
                proxy_redirect     default;
                proxy_set_header   X-Real-IP  $remote_addr;
                proxy_set_header   Host       $host;
        }

        # location / {
        #         proxy_pass         http://kairlyjs-3082.rostiapp.cz/;
        #         proxy_redirect     default;
        #         proxy_set_header   Host kairlyjs-3082.rostiapp.cz;
        # }
        # location /api/ {
        #         proxy_pass         http://127.0.0.1:8080/api/;
        #         proxy_redirect     default;
        #         proxy_set_header   X-Real-IP  $remote_addr;
        #         proxy_set_header   Host       $host;
        # }
        # location /admin/ {
        #         proxy_pass         http://127.0.0.1:8080/admin/;
        #         proxy_redirect     default;
        #         proxy_set_header   X-Real-IP  $remote_addr;
        #         proxy_set_header   Host       $host;
        # }

        location /static/ {
                alias /srv/app/static/;
        }
        location /media/ {
                alias /srv/app/media/;
        }
}
