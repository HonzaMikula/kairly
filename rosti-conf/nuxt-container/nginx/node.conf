server {
        listen       0.0.0.0:8000;
        listen       [::]:8000;

        if ($http_host = www.kairly.com) {
                rewrite  (.*)  https://kairly.com$1;
        }

        location / {
                proxy_pass         http://127.0.0.1:3000/;
                proxy_redirect     default;
                proxy_set_header   X-Real-IP  $remote_addr;
                proxy_set_header   Host       $host;
        }

        location /api/ {
                proxy_pass         http://kairly-2648.rostiapp.cz/api/;
                proxy_redirect     default;
                proxy_set_header   Host kairly-2648.rostiapp.cz;
        }

        location /admin/ {
                proxy_pass         http://kairly-2648.rostiapp.cz/admin/;
                proxy_redirect     default;
                proxy_set_header   Host kairly-2648.rostiapp.cz;
        }

        location /static/ {
                proxy_pass         http://kairly-2648.rostiapp.cz/static/;
                proxy_redirect     default;
                proxy_set_header   Host kairly-2648.rostiapp.cz;
        }

        location /media/ {
                proxy_pass         http://kairly-2648.rostiapp.cz/media/;
                proxy_redirect     default;
                proxy_set_header   Host kairly-2648.rostiapp.cz;
        }

        #location /static/ {
        #        alias /srv/static/;
        #}
}
